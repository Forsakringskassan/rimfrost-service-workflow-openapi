openapi: 3.0.3
info:
  title: Workflow API
  version: 1.0.0
  description: API för att hantera workflows.

paths:
  /handlaggning/{handlaggningId}/process:
    post:
      tags: [ WorkflowController ]
      operationId: postHandlaggningProcess
      summary: Starta en ny process för en befintlig handläggning
      description: Startar en ny processinstans för en befintlig handläggning utan att avbryta en eventuellt pågående process.
      parameters:
        - name: handlaggningId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Handläggningens unika ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostHandlaggningProcessRequest'
      responses:
        '200':
          description: Process startad OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostHandlaggningProcessResponse'
        '400':
          description: Ogiltigt anrop
        '404':
          description: Handläggning hittades inte
        '500':
          description: Internt serverfel

  /yrkande:
    post:
      tags: [ WorkflowController ]
      operationId: postYrkande
      summary: Skapa ett nytt yrkande
      description: Skapa ett nytt yrkande
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostYrkandeRequest'
      responses:
        '201':
          description: Skapat yrkande OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostYrkandeResponse'
        '400':
           description: Ogiltigt anrop
        '500':
           description: Internt serverfel

components:
  schemas:

    PostHandlaggningProcessRequest:
      type: object
      description: Data som krävs för att starta en ny process för en befintlig handläggning
      properties:
        replyTo:
          type: string
          description: Kafka topic som notifiering om avslutad handläggning skickas till
          minLength: 1
      required:
        - replyTo

    PostHandlaggningProcessResponse:
      type: object
      description: Svar vid start av ny process för en befintlig handläggning
      properties:
        handlaggning:
          $ref: '#/components/schemas/Handlaggning'
      required:
        - handlaggning

    PostYrkandeRequest:
      type: object
      description: Data som krävs för att skapa ett nytt yrkande
      properties:
        ingangtypId:
          type: string
          description: Unikt ID som identifierar vilken ingångtyp yrkandet avser
        yrkandeFrom:
          type: string
          format: date-time
          description: Yrkande från och med datum
        yrkandeTom:
          type: string
          format: date-time
          description: Yrkande till och med datum
        rollerIYrkande:
          type: array
          description: Lista av personer involverade i yrkandet samt deras roll
          items:
            $ref: '#/components/schemas/PostRollIYrkande'
        sakfragorStallningstaganden:
          type: array
          description: Lista av sakfrågor och ställningstaganden i yrkandet
          items:
            $ref: '#/components/schemas/PostSakfragaStallningstagande'
        handlaggningspecifikationId:
          type: string
          format: uuid
        avsiktsId:
          type: string
          description: Unikt ID som identifierar avsikten med yrkandet
        replyTo:
          type: string
          description: Kafka topic som notifiering om avslutad handläggning skickas till
          minLength: 1
      required:
        - ingangtypId
        - yrkandeFrom
        - yrkandeTom
        - rollerIYrkande
        - sakfragorStallningstaganden
        - handlaggningspecifikationId
        - avsiktsId
        - replyTo
      example:
        ingangtypId: "a3b9c7b8-1234-4567-89ab-123456789abc"
        yrkandeFrom: "2025-01-01T00:00:00Z"
        yrkandeTom: "2025-01-02T00:00:00Z"
        rollerIYrkande:
          - individ:
              typId: "58435904-c2b6-4b1f-a0ab-62f1839d8ff2"
              varde: "19901010-1234"
            yrkandeRollId: "58435904-c2b6-4b1f-a0ab-62f1839d8ff2"
        sakfragorStallningstaganden:
          - objektTypId: "ERSATTNING"
            data: "{}"
        handlaggningspecifikationId: "4cc0aec3-752b-4590-8fc5-7986d01a426f"
        avsiktsId: "8b817501-4f57-4929-bcb9-f9be361f0424"
        replyTo: "handlaggning-done-responses"

    PostRollIYrkande:
      type: object
      description: En individ tillsammans med dess roll i ett nytt yrkande
      properties:
        individ:
          $ref: '#/components/schemas/Idtyp'
          description: Unikt id till en individ
        yrkandeRollId:
          type: string
          description: Unikt id till en yrkande roll
      required:
        - individ
        - yrkandeRollId

    PostSakfragaStallningstagande:
      type: object
      description: Sakfråga eller ställningstagande i ett nytt yrkande
      properties:
        objektTypId:
          type: string
          description: Unikt ID som identifierar vilken typ av sakfråga/ställningstagande det gäller
        data:
          type: string
          description: Json data av den typ som objektTypId avser
      required:
        - objektTypId
        - data

    PostYrkandeResponse:
      type: object
      description: Svar vid skapande av ett nytt yrkande
      properties:
        handlaggning:
          $ref: '#/components/schemas/Handlaggning'
      required:
        - handlaggning

    Yrkande:
      type: object
      description: Yrkande
      properties:
        id:
          type: string
          description: Yrkandets unika ID
          format: uuid
        version:
          type: integer
          description: Yrkandets version
        ingangtypId:
          type: string
          description: Ingångtypens unika ID
        yrkandedatum:
          type: string
          description: Datetime när yrkandet uppstod, enligt ISO 8601
          format: date-time
        yrkandestatus:
          type: string
          description: Unikt ID som identifierar status för yrkandet
        yrkandeFrom:
          type: string
          format: date-time
          description: Yrkande från och med datum
        yrkandeTom:
          type: string
          format: date-time
          description: Yrkande till och med datum
        avsikt:
          type: string
          description: Unikt ID som identifierar avsikt för yrkandet
        rollerIYrkande:
          type: array
          description: Lista av personer involverade i yrkandet samt deras roll
          items:
            $ref: '#/components/schemas/RollIYrkande'
        sakfragorStallningstaganden:
          type: array
          description: Lista av sakfrågor och ställningstaganden i yrkandet
          items:
            $ref: '#/components/schemas/SakfragaStallningstagandeContainer'
        beslut:
          type: array
          description: Lista av beslut
          items:
            $ref: '#/components/schemas/Beslut'
      required:
        - id
        - version
        - ingangtypId
        - yrkandedatum
        - yrkandestatus
        - yrkandeFrom
        - yrkandeTom
        - avsikt
        - rollerIYrkande
        - sakfragorStallningstaganden
        - beslut

    SakfragaStallningstagandeContainer:
      type: object
      description: Container för sakfråga eller ställningstagande
      properties:
        id:
          type: string
          format: uuid
          description: Unikt id
        objektTypId:
          type: string
          description: Unikt ID som identifierar vilken typ av sakfråga/ställningstagande det gäller
        data:
          type: string
          description: Json data av den typ som objektTypId avser
      required:
        - id
        - objektTypId
        - data

    Handlaggning:
      type: object
      description: Handläggning, ärendeinstans
      properties:
        id:
          type: string
          description: Handläggningens unika ID
          format: uuid
        version:
          type: integer
          description: Handläggningens version
        yrkande:
          $ref: '#/components/schemas/Yrkande'
        handlaggningIdTyp:
          type: string
          description: Unikt ID som identifierar handläggningstyp
        handlaggningIdVarde:
          type: string
          nullable: true
          description: Handläggningens Id värde
        skapadTS:
          type: string
          description: DateTime när handläggning skapades, enligt ISO 8601
          format: date-time
        avslutadTS:
          type: string
          description: DateTime när handläggning avslutades, enligt ISO 8601
          format: date-time
          nullable: true
        handlaggningspecifikationId:
          type: string
          format: uuid
      required:
        - id
        - version
        - yrkande
        - handlaggningIdTyp
        - skapadTS
        - handlaggningspecifikationId

    RollIYrkande:
      type: object
      description: Representerar en individ tillsammans med dess roll
      properties:
        id:
          type: string
          format: uuid
          description: Unikt id för denna individ och roll kopplat till ett yrkande
        individ:
          $ref: '#/components/schemas/Idtyp'
          description: Unikt id till en individ
        yrkandeRollId:
          type: string
          description: Unikt id till en yrkande roll
        avserYrkande:
          type: string
          format: uuid
          description: Unikt id som identifierar vilket yrkande denna RollIYrkande avser
      required:
        - id
        - individ
        - yrkandeRollId
        - avserYrkande

    Beslut:
      type: object
      description: Beslut för yrkandet
      properties:
        id:
          type: string
          format: uuid
          description: Unikt ID för beslut
        version:
          type: integer
          description: Specificerar version av beslutet
        datum:
          type: string
          format: date-time
          description: Tidpunkt för beslutet, enligt ISO 8601
        beslutsfattare:
          $ref: '#/components/schemas/Idtyp'
          description: Beslutsfattarens individ-id
        beslutsrader:
          type: array
          items:
            $ref: '#/components/schemas/Beslutsrad'
      required:
        - id
        - version
        - datum
        - beslutsfattare
        - beslutsrader

    Beslutsrad:
      type: object
      description: En beslutsrad i ett beslut
      properties:
        id:
          type: string
          format: uuid
          description: Unikt ID för beslutsrad
        version:
          type: integer
          description: Specificerar version av beslutsrad
        beslutsTyp:
          type: string
          description: Unikt ID som identifierar typ av beslut för beslutsrad
        beslutsUtfall:
          type: string
          description: Unikt ID som identifierar utfall för beslutsrad
        avslutsTyp:
          type: string
          description: Unikt ID som identifierar typ av avslut för beslutsrad
        sakfragorStallningstaganden:
          type: array
          description: Lista av ID och version som identifierar SakfragaStallningstagande
          items:
            $ref: '#/components/schemas/SakfragaStallningstagandeRef'
      required:
        - id
        - version
        - beslutsTyp
        - beslutsUtfall
        - avslutsTyp
        - sakfragorStallningstaganden

    SakfragaStallningstagandeRef:
      type: object
      description: Referens till en sakfråga eller ställningstagande
      properties:
        id:
          type: string
          format: uuid
          description: Unikt ID för sakfrågan eller ställningstagande
        version:
          type: integer
          description: Specificerar version av sakfrågan eller ställningstagande
      required:
        - id
        - version

    Idtyp:
      type: object
      properties:
        typId:
          type: string
          description: Unikt ID som identifierar vilken typ av värde som anges
        varde:
            type: string
            description: ID-värde som identifieras av typ
      required:
        - typId
        - varde
      example:
        typId: "4c34906c-03d9-425f-9a1a-062ef6eb88c7"
        varde: "19901010-1234"
